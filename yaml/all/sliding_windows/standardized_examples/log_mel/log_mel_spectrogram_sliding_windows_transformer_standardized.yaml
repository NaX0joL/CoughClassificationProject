experiment_id: log_mel_spectrogram_sliding_windows_transformer_standardized

config:
    type: ExperimentConfig

    data_pipeline_config:
        type: DataPipelineConfig
        name: log_mel_spectrogram_sliding_windows_standardized
        source_reader:
            type: ElderlyCoughAudioSourceReader
            root_path:
                type: Path
                value: data/Elderly_Cough_Audio
        segmenter:
            type: SlidingWindowSegmenter
            window_size: 8200
            stride: 4100
            overlap_threshold: 0.7
            negative_label: 0
            keep_short_segments: false
            kept_metadata_key:
                - patient_id
                - cough_audio
        transformer:
            - type: LogMelSpectrogram
              sample_rate: 16000
              n_fft: 512
              win_length: 400
              hop_length: 160
              n_mels: 40
              log_offset: 0.000001
            - type: FeatureWiseStandardization
        padder: null
        splitter:
            type: DataSplitter
            group_metadata_key: patient_id
            test_ratio: 0.1
            number_of_folds: 5
            random_seed: 42

    model_config:
        type: ModelConfig
        architecture:
            type: PatchTST
            seq_len: 52
            pred_len: 2
            patch_len: 1
            stride: 1
            enc_in_feature: 40
            e_layers_num: 2
            n_heads_num: 4
            d_model: 128
            d_ff: 256
            dropout: 0.3
            fc_dropout: 0.2
            head_dropout: 0.2
            attn_dropout: 0.1
            use_pre_norm: false
            max_seq_len: 1024
            d_k: null
            d_v: null
            norm: BatchNorm
            act: gelu
            key_padding_mask: auto
            padding_var: null
            attention_mask: null
            res_attention: true
            store_attn: true
            pe: zeros
            learn_pe: true
            pretrain_head: false
            head_type: flatten
            individual: false
            padding_patch: null
            use_revin: false
            use_affine: false
            use_subtract_last: false
            use_positional_encoding: true
            decomposition: false
            kernel_size: 25
            bottleneck_dim: 128
            n_normal_heads: 0
            n_mp_attn_heads: 0
            qk_weight_share: false
            attention_output_scaling: 1.0
            verbose: false
        behavior:
            type: ClassificationBehavior

    training_config:
        type: TrainingConfig
        random_seed: 42
        num_epochs: 100
        criterion_name: cross_entropy
        optimizer_name: adamw
        learning_rate: 0.0001
        weight_decay: 0.001
        batch_size: 16
        num_workers: 0
        drop_last: false
        class_weighting: balanced
        early_stopping_patience: null
        load_best_model: true

    metrics_config:
        type: MetricsConfig
        metrics:
            - type: RocAucMetric
            - type: PRAucMetric
            - type: PrecisionMetric
            - type: RecallMetric
            - type: SpecificityMetric
            - type: F1ScoreMetric
            - type: AccuracyMetric
            - type: MacroAccuracyMetric
            - type: MacroF1ScoreMetric
            - type: MacroPrecisionMetric
            - type: MacroRecallMetric

    persistence_config:
        type: PersistenceConfig
        number_of_train_model_outputs: 20
        number_of_validation_model_outputs: 20
        feature_color_percentile: 99.0
        feature_colormap: inferno
        x_axis_label: Frame
        y_axis_label: Mel band
        colorbar_label: Log-mel energy
        include_grad_cam: false
        include_legrad: true
